<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contadores con Local Storage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }

    .container {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #555;
      background-color: #222;
      color: white;
      text-align: center;
    }

    .counter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
    }

    .counter span {
      font-size: 18px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .count {
      font-size: 22px;
      font-weight: bold;
    }

    .counter-container {
      display: flex;
      align-items: center;
      flex-direction: column;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Control de Contadores</h1>
    
    <input type="date" id="datePicker" onchange="loadCounters()">

    <div class="counter-container">
      <span>Micros mal colocados</span>
      <div class="counter">
        <button onclick="decreaseCount('micros')">-</button>
        <span id="micros" class="count">0</span>
        <button onclick="increaseCount('micros')">+</button>
      </div>
    </div>

    <div class="counter-container">
      <span>Botoneras encendidas</span>
      <div class="counter">
        <button onclick="decreaseCount('botoneras')">-</button>
        <span id="botoneras" class="count">0</span>
        <button onclick="increaseCount('botoneras')">+</button>
      </div>
    </div>

    <div class="counter-container">
      <span>Luces encendidas</span>
      <div class="counter">
        <button onclick="decreaseCount('luces')">-</button>
        <span id="luces" class="count">0</span>
        <button onclick="increaseCount('luces')">+</button>
      </div>
    </div>

    <div class="counter-container">
      <span>Puertas abiertas</span>
      <div class="counter">
        <button onclick="decreaseCount('puertas')">-</button>
        <span id="puertas" class="count">0</span>
        <button onclick="increaseCount('puertas')">+</button>
      </div>
    </div>
  </div>

  <script>
    function getCurrentDate() {
      const today = new Date();
      return today.toISOString().split('T')[0]; 
    }

    function loadCounters() {
      const selectedDate = document.getElementById("datePicker").value;
      const savedData = localStorage.getItem(selectedDate);

      if (savedData) {
        const counters = JSON.parse(savedData);
        document.getElementById("micros").textContent = counters.micros;
        document.getElementById("botoneras").textContent = counters.botoneras;
        document.getElementById("luces").textContent = counters.luces;
        document.getElementById("puertas").textContent = counters.puertas;
      } else {
        document.getElementById("micros").textContent = 0;
        document.getElementById("botoneras").textContent = 0;
        document.getElementById("luces").textContent = 0;
        document.getElementById("puertas").textContent = 0;
      }
    }

    function saveCounters() {
      const selectedDate = document.getElementById("datePicker").value;
      if (!selectedDate) return;

      const counters = {
        micros: parseInt(document.getElementById("micros").textContent),
        botoneras: parseInt(document.getElementById("botoneras").textContent),
        luces: parseInt(document.getElementById("luces").textContent),
        puertas: parseInt(document.getElementById("puertas").textContent),
      };

      localStorage.setItem(selectedDate, JSON.stringify(counters));
    }

    function increaseCount(id) {
      const element = document.getElementById(id);
      element.textContent = parseInt(element.textContent) + 1;
      saveCounters();
    }

    function decreaseCount(id) {
      const element = document.getElementById(id);
      if (parseInt(element.textContent) > 0) {
        element.textContent = parseInt(element.textContent) - 1;
        saveCounters();
      }
    }

    window.onload = function () {
      document.getElementById("datePicker").value = getCurrentDate();
      loadCounters();
    };
  </script>

</body>

</html>
